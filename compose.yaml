services:
  app:
    image: ${AI_DEMO_IMAGE:-ghcr.io/martinbelas/ai-demo:latest}
    build:
      context: .
    ports:
      - "${AI_DEMO_PORT:-8080}:8080"
    environment:
      APP_INTERFACE: http
      PORT: 8080
      LLM_PROVIDER: ${LLM_PROVIDER:-OLLAMA}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      # Compose only wires Ollama embeddings, so RAG follows OLLAMA_ENABLED unless set explicitly.
      RAG_ENABLED: ${RAG_ENABLED:-${OLLAMA_ENABLED:-true}}
      RAG_EMBEDDING_BASE_URL: http://ollama:11434
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      AGENT_LAB_ENABLED: ${AGENT_LAB_ENABLED:-false}
      AGENT_LAB_BASE_URL: ${AGENT_LAB_BASE_URL:-http://host.docker.internal:8081}
      AGENT_LAB_TIMEOUT_SECONDS: ${AGENT_LAB_TIMEOUT_SECONDS:-70}
      AGENT_LAB_AUTHENTICATION: ${AGENT_LAB_AUTHENTICATION:-NONE}
    extra_hosts:
      # Lets the container reach an ai-agent-lab service running on the host (also on Linux).
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ollama-model:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ollama-embedding-model:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${RAG_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-data:
