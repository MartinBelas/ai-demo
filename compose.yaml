services:
  app:
    image: ${AI_DEMO_IMAGE:-ghcr.io/martinbelas/ai-demo:latest}
    build:
      context: .
    ports:
      - "${AI_DEMO_PORT:-8080}:8080"
    environment:
      APP_INTERFACE: http
      PORT: 8080
      LLM_PROVIDER: ${LLM_PROVIDER:-OLLAMA}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ollama-model:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  ollama-data:
