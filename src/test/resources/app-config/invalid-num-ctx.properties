package ai.demo.config;

import static org.junit.jupiter.api.Assertions.assertEquals;
import static org.junit.jupiter.api.Assertions.assertThrows;

import java.io.IOException;
import org.junit.jupiter.api.Test;

class AppConfigLoaderTest {

private final AppConfigLoader loader = new AppConfigLoader();

@Test
void shouldLoadConfiguration() throws IOException {

AppConfig config = loader.loadFromResource("config/valid.properties");

assertEquals("http://localhost:11434", config.baseUrl());
assertEquals("qwen3:4b", config.model());
assertEquals(0.7, config.temperature());
assertEquals(2000, config.numPredict());
assertEquals(4096, config.numCtx());
}

@Test
void shouldFailWhenResourceDoesNotExist() {

assertThrows(
IllegalStateException.class,
() -> loader.loadFromResource("config/does-not-exist.properties"));
}

@Test
void shouldFailWhenRequiredPropertyIsMissing() {

assertThrows(
IllegalStateException.class,
() -> loader.loadFromResource("config/missing-model.properties"));
}

@Test
void shouldFailForInvalidTemperature() {

assertThrows(
IllegalStateException.class,
() -> loader.loadFromResource("config/invalid-temperature.properties"));
}

@Test
void shouldFailForInvalidNumPredict() {

assertThrows(
IllegalStateException.class,
() -> loader.loadFromResource("config/invalid-num-predict.properties"));
}

@Test
void shouldFailForInvalidNumCtx() {

assertThrows(
IllegalStateException.class,
() -> loader.loadFromResource("config/invalid-num-ctx.properties"));
}
}