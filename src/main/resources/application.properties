app.interface=console
server.port=8080

llm.provider=ollama
llm.temperature=0.4
llm.max-output-tokens=1000
llm.system-message=You are a helpful AI assistant. Be concise and clear. If you are uncertain, state it directly.

ollama.model=qwen3:4b
ollama.enabled=true
ollama.base-url=http://localhost:11434
ollama.context-window=4096
ollama.repeat-penalty=1.18

openai.model=gpt-5.4-mini
openai.base-url=https://api.openai.com/v1
openai.api-key-env=OPENAI_API_KEY

groq.model=qwen/qwen3.6-27b
groq.base-url=https://api.groq.com/openai/v1
groq.api-key-env=GROQ_API_KEY

gemini.model=gemini-3.7-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.api-key-env=GEMINI_API_KEY

conversation.file=conversation.json

demo.limits.enabled=false
demo.limits.firestore.enabled=false
demo.limits.firestore.project-id=
demo.limits.firestore.database-id=(default)
demo.limits.ip-hash-salt-env=DEMO_IP_HASH_SALT
demo.limits.daily-requests=200
demo.limits.hourly-requests-per-ip=20
demo.limits.concurrent-streams=5
demo.limits.max-input-characters=20000
demo.limits.max-history-messages=10
demo.limits.max-rag-chunks=5
demo.limits.max-output-tokens-per-call=1000
