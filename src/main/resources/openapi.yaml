openapi: 3.1.0
info:
  title: AI Demo API
  version: 1.0.0
  description: >-
    Provider-independent API for the AI Demo application.
    Every /api/ request may send an X-Request-ID header (1-64 characters of A-Z a-z 0-9 . _ -);
    the same value, or a new 8-character ID when it is missing or invalid, is returned in the
    X-Request-ID response header and appears in the server logs of that request.

tags:
  - name: System
    description: Application health and operational endpoints.
  - name: LLM Providers
    description: LLM providers available in the current deployment.
  - name: Chat
    description: Stateless chat operations.

paths:
  /api/app/status:
    get:
      tags: [System]
      summary: Read aggregate application usage for today in UTC
      operationId: getAppStatus
      description: >-
        Daily counters are collected only when demo limits are enabled and cached for up to
        ten seconds. Requests count accepted chat reservations, including subsequent failures.
        Outcomes are best-effort and may not sum to requests (in-flight requests, restarts,
        storage failures or legacy counters). Tokens include successfully reconciled usage only.
        Streams are assigned to the UTC date of admission. Active streams and uptime refer
        to this instance. No visitor identities or conversation content are exposed.
      responses:
        "200":
          description: Aggregate status; trackingEnabled=false means counters are not measured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStatus"
        "503":
          description: Metrics storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: APP_METRICS_UNAVAILABLE
                message: Application metrics are temporarily unavailable.
  /api/health:
    get:
      tags:
        - System
      summary: Check application health
      operationId: getHealth
      responses:
        "200":
          description: The application is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
  /api/agent/status:
    get:
      tags:
        - System
      summary: Check whether agent mode is enabled
      description: >-
        Agent mode answers chat requests with `agent: true` through a separate agent service
        (ai-agent-lab) with web search, independently of the LLM provider.
      operationId: getAgentStatus
      responses:
        "200":
          description: Agent mode availability in this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
              example:
                enabled: false
  /api/llm/providers:
    get:
      tags:
        - LLM Providers
      summary: List available LLM providers
      operationId: getLlmProviders
      responses:
        "200":
          description: Providers with complete configuration and required credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProvidersResponse"
              example:
                providers:
                  - id: OLLAMA
                    model: qwen3:4b
  /api/chat:
    post:
      tags:
        - Chat
      summary: Create a stateless chat response
      description: The complete bounded conversation context is supplied by the client.
      operationId: createChatResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              provider: OLLAMA
              messages:
                - role: USER
                  content: What is Spring?
      responses:
        "200":
          description: Chat response generated by the selected provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request or unavailable LLM provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRequest:
                  summary: Request failed validation
                  value:
                    code: INVALID_REQUEST
                    message: Invalid chat request.
                    details:
                      - field: messages
                        message: At least one chat message is required.
                providerUnavailable:
                  summary: Provider is disabled or unconfigured
                  value:
                    code: LLM_PROVIDER_UNAVAILABLE
                    message: The selected LLM provider is not available.
                agentModeDisabled:
                  summary: Agent mode was requested but is not enabled
                  value:
                    code: AGENT_MODE_DISABLED
                    message: Agent mode is not enabled in this deployment.
        "429":
          description: A configured public demo limit has been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DEMO_LIMIT_EXCEEDED
                message: A usage limit for this demo application has been reached. Please try again later.
        "503":
          description: Public demo quota enforcement is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DEMO_LIMIT_UNAVAILABLE
                message: The public demo is temporarily unavailable.
        "502":
          description: Communication with the selected LLM provider or the agent service failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                providerError:
                  summary: LLM provider communication failed
                  value:
                    code: LLM_COMMUNICATION_ERROR
                    message: Unable to communicate with the OPENAI AI model. Try selecting a different AI provider or try again later.
                agentUnavailable:
                  summary: Agent service failed, timed out, or returned an invalid response
                  value:
                    code: AGENT_UNAVAILABLE
                    message: Agent mode is temporarily unavailable. Try again later or turn agent mode off.
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_ERROR
                message: An unexpected error occurred.
  /api/chat/stream:
    post:
      tags:
        - Chat
      summary: Stream a stateless chat response
      description: |
        Returns Server-Sent Events named `thinking`, `tool`, `content`, `completion`, and `error`.
        Tool events expose only the tool name and lifecycle status, not tool input or output.
        The client supplies the complete bounded conversation context in the request body.
      operationId: streamChatResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Typed SSE events followed by completion or a terminal error.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                completed:
                  summary: Successful stream
                  value: |-
                    event: tool
                    data: {"name":"calculator","status":"RUNNING"}

                    event: tool
                    data: {"name":"calculator","status":"COMPLETED"}

                    event: content
                    data: {"content":"Hello!"}

                    event: completion
                    data: {"model":"qwen3:4b","tokenUsage":{"promptTokens":12,"completionTokens":4,"totalTokens":16},"durationMs":25}
                terminalError:
                  summary: Demo quota reconciliation failed mid-stream
                  value: |-
                    event: content
                    data: {"content":"Hello"}

                    event: error
                    data: {"code":"DEMO_LIMIT_UNAVAILABLE","message":"The public demo is temporarily unavailable."}
                providerError:
                  summary: Provider communication or quota failure mid-stream
                  value: |-
                    event: content
                    data: {"content":"Hello"}

                    event: error
                    data: {"code":"LLM_COMMUNICATION_ERROR","message":"Unable to communicate with the OPENAI AI model. Try selecting a different AI provider or try again later."}
                agentMode:
                  summary: Agent mode answer with web sources (single content event)
                  value: |-
                    event: content
                    data: {"content":"1 EUR is 24.30 CZK today."}

                    event: completion
                    data: {"model":"agent-lab","tokenUsage":{"promptTokens":900,"completionTokens":120,"totalTokens":1020},"durationMs":4200,"webSources":[{"title":"CNB rates","url":"https://www.cnb.cz/rates"}]}
        "400":
          description: Invalid request or unavailable LLM provider before streaming starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRequest:
                  summary: Request failed validation
                  value:
                    code: INVALID_REQUEST
                    message: Invalid chat request.
                    details:
                      - field: messages
                        message: At least one chat message is required.
                providerUnavailable:
                  summary: Provider is disabled or unconfigured
                  value:
                    code: LLM_PROVIDER_UNAVAILABLE
                    message: The selected LLM provider is not available.
                agentModeDisabled:
                  summary: Agent mode was requested but is not enabled
                  value:
                    code: AGENT_MODE_DISABLED
                    message: Agent mode is not enabled in this deployment.
        "429":
          description: A configured public demo limit has been reached before streaming starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DEMO_LIMIT_EXCEEDED
                message: A usage limit for this demo application has been reached. Please try again later.
        "503":
          description: Public demo quota enforcement is temporarily unavailable before streaming starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: DEMO_LIMIT_UNAVAILABLE
                message: The public demo is temporarily unavailable.

components:
  schemas:
    AppStatus:
      type: object
      additionalProperties: false
      required: [trackingEnabled, persistent, period, requests, tokens, completed, failed, disconnected, averageDurationMs, activeStreams, uptimeSeconds, dailyRequestLimit, requestsRemaining]
      properties:
        trackingEnabled:
          type: boolean
        persistent:
          type: boolean
          description: True when enabled counters use Firestore; otherwise counters reset on restart.
        period:
          type: string
          format: date
          description: Current UTC date.
        requests:
          type: integer
          format: int64
          minimum: 0
        tokens:
          type: integer
          format: int64
          minimum: 0
        completed:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        disconnected:
          type: integer
          format: int64
          minimum: 0
        averageDurationMs:
          type: [number, "null"]
          minimum: 0
          description: Average server processing time for completed requests, null without samples.
        activeStreams:
          type: integer
          minimum: 0
          description: Current instance only, including streams admitted on previous days.
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Time since this instance initialized the status service.
        dailyRequestLimit:
          type: [integer, "null"]
          minimum: 0
          description: Null when demo limits are disabled.
        requestsRemaining:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Null when demo limits are disabled.
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
    LlmProvidersResponse:
      type: object
      additionalProperties: false
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/LlmProvider"
    LlmProvider:
      type: object
      additionalProperties: false
      required:
        - id
        - model
      properties:
        id:
          type: string
          enum:
            - OLLAMA
            - OPENAI
            - GROQ
            - GEMINI
        model:
          type: string
          minLength: 1
    ChatRequest:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        provider:
          type: string
          description: Uses the configured default provider when omitted.
          enum:
            - OLLAMA
            - OPENAI
            - GROQ
            - GEMINI
        messages:
          type: array
          description: Conversation context ending with a USER message.
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        rag:
          type: boolean
          default: false
          description: Answers from bundled project documents and returns `sources`.
        agent:
          type: boolean
          default: false
          description: >-
            Agent mode: the separate agent service answers with its own model and web search
            and returns `webSources`; `provider` is not used. Cannot be combined with `rag`.
            The last message may contain at most 4000 characters; earlier messages are
            shortened or dropped to fit the agent service limits.
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        content:
          type: string
          minLength: 1
    ChatResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - model
        - tokenUsage
        - durationMs
      properties:
        answer:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
        durationMs:
          type: integer
          format: int64
          minimum: 0
        sources:
          type: array
          description: Document passages supplied to the model (RAG only); omitted when empty.
          items:
            $ref: "#/components/schemas/RagSource"
        webSources:
          type: array
          description: Web pages found by the agent (agent mode only); omitted when empty.
          items:
            $ref: "#/components/schemas/WebSource"
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - promptTokens
        - completionTokens
        - totalTokens
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
    SseTextEvent:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
    SseToolEvent:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          example: calculator
        status:
          type: string
          enum:
            - RUNNING
            - COMPLETED
    SseCompletionEvent:
      type: object
      additionalProperties: false
      required:
        - model
        - tokenUsage
        - durationMs
      properties:
        model:
          type: string
          minLength: 1
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
        durationMs:
          type: integer
          format: int64
          minimum: 0
        sources:
          type: array
          description: Document passages supplied to the model (RAG only); omitted when empty.
          items:
            $ref: "#/components/schemas/RagSource"
        webSources:
          type: array
          description: Web pages found by the agent (agent mode only); omitted when empty.
          items:
            $ref: "#/components/schemas/WebSource"
    RagSource:
      type: object
      additionalProperties: false
      required: [id, document, chunk, text]
      properties:
        id:
          type: string
        document:
          type: string
        chunk:
          type: integer
          minimum: 1
        text:
          type: string
    WebSource:
      type: object
      additionalProperties: false
      required: [title, url]
      properties:
        title:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          description: Absolute http or https URL.
    AgentStatus:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: DEMO_LIMIT_EXCEEDED
        message:
          type: string
          example: A usage limit for this demo application has been reached. Please try again later.
        details:
          type: array
          description: Safe field-level details when the client can correct the request.
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: messages[0].content
        message:
          type: string
          example: Content must not be blank.
