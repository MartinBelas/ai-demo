openapi: 3.1.0
info:
  title: AI Demo API
  version: 1.0.0
  description: Provider-independent API for the AI Demo application.

tags:
  - name: System
    description: Application health and operational endpoints.
  - name: LLM Providers
    description: LLM providers available in the current deployment.
  - name: Chat
    description: Stateless chat operations.

paths:
  /api/health:
    get:
      tags:
        - System
      summary: Check application health
      operationId: getHealth
      responses:
        "200":
          description: The application is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
  /api/llm/providers:
    get:
      tags:
        - LLM Providers
      summary: List available LLM providers
      operationId: getLlmProviders
      responses:
        "200":
          description: Providers with complete configuration and required credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProvidersResponse"
              example:
                providers:
                  - id: OLLAMA
                    model: qwen3:4b
  /api/chat:
    post:
      tags:
        - Chat
      summary: Create a stateless chat response
      description: The complete bounded conversation context is supplied by the client.
      operationId: createChatResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              provider: OLLAMA
              messages:
                - role: USER
                  content: What is Spring?
      responses:
        "200":
          description: Chat response generated by the selected provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request or unavailable LLM provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Communication with the selected LLM provider failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/stream:
    post:
      tags:
        - Chat
      summary: Stream a stateless chat response
      description: |
        Returns Server-Sent Events named `thinking`, `content`, `completion`, and `error`.
        The client supplies the complete bounded conversation context in the request body.
      operationId: streamChatResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Typed SSE events followed by completion or a terminal error.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                completed:
                  summary: Successful stream
                  value: |-
                    event: content
                    data: {"content":"Hello!"}

                    event: completion
                    data: {"model":"qwen3:4b","tokenUsage":{"promptTokens":12,"completionTokens":4,"totalTokens":16},"durationMs":25}
        "400":
          description: Invalid request or unavailable LLM provider before streaming starts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
    LlmProvidersResponse:
      type: object
      additionalProperties: false
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/LlmProvider"
    LlmProvider:
      type: object
      additionalProperties: false
      required:
        - id
        - model
      properties:
        id:
          type: string
          enum:
            - OLLAMA
            - OPENAI
            - GROQ
            - GEMINI
        model:
          type: string
          minLength: 1
    ChatRequest:
      type: object
      additionalProperties: false
      required:
        - messages
      properties:
        provider:
          type: string
          description: Uses the configured default provider when omitted.
          enum:
            - OLLAMA
            - OPENAI
            - GROQ
            - GEMINI
        messages:
          type: array
          description: Conversation context ending with a USER message.
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - USER
            - ASSISTANT
        content:
          type: string
          minLength: 1
    ChatResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - model
        - tokenUsage
        - durationMs
      properties:
        answer:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
        durationMs:
          type: integer
          format: int64
          minimum: 0
    TokenUsage:
      type: object
      additionalProperties: false
      required:
        - promptTokens
        - completionTokens
        - totalTokens
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
    SseTextEvent:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
    SseCompletionEvent:
      type: object
      additionalProperties: false
      required:
        - model
        - tokenUsage
        - durationMs
      properties:
        model:
          type: string
          minLength: 1
        tokenUsage:
          $ref: "#/components/schemas/TokenUsage"
        durationMs:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: DEMO_LIMIT_EXCEEDED
        message:
          type: string
          example: A usage limit for this demo application has been reached. Please try again later.
