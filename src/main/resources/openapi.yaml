openapi: 3.1.0
info:
  title: AI Demo API
  version: 1.0.0
  description: Provider-independent API for the AI Demo application.

tags:
  - name: System
    description: Application health and operational endpoints.

paths:
  /api/health:
    get:
      tags:
        - System
      summary: Check application health
      operationId: getHealth
      responses:
        "200":
          description: The application is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: DEMO_LIMIT_EXCEEDED
        message:
          type: string
          example: A usage limit for this demo application has been reached. Please try again later.
