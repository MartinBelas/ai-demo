openapi: 3.1.0
info:
  title: AI Demo API
  version: 1.0.0
  description: Provider-independent API for the AI Demo application.

tags:
  - name: System
    description: Application health and operational endpoints.
  - name: LLM Providers
    description: LLM providers available in the current deployment.

paths:
  /api/health:
    get:
      tags:
        - System
      summary: Check application health
      operationId: getHealth
      responses:
        "200":
          description: The application is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: UP
  /api/llm/providers:
    get:
      tags:
        - LLM Providers
      summary: List available LLM providers
      operationId: getLlmProviders
      responses:
        "200":
          description: Providers with complete configuration and required credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmProvidersResponse"
              example:
                providers:
                  - id: OLLAMA
                    model: qwen3:4b

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
    LlmProvidersResponse:
      type: object
      additionalProperties: false
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/LlmProvider"
    LlmProvider:
      type: object
      additionalProperties: false
      required:
        - id
        - model
      properties:
        id:
          type: string
          enum:
            - OLLAMA
            - OPENAI
            - GROQ
            - GEMINI
        model:
          type: string
          minLength: 1
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: DEMO_LIMIT_EXCEEDED
        message:
          type: string
          example: A usage limit for this demo application has been reached. Please try again later.
